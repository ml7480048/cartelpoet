<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuriy Novodvorski — Coming Soon · cartelpoet88</title>
<meta name="description" content="Yuriy Novodvorski (cartelpoet88) — the second part of Moleskin, coming soon. Only here.">
<meta property="og:title" content="Yuriy Novodvorski — Coming Soon">
<meta property="og:description" content="The second part of Moleskin — only here.">
<meta property="og:type" content="website">
<meta property="og:image" content="banner.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#efe9db;
    --dark:#0e1a15;
    --gold:#c3a35a;
    --gold-soft:#d8bd80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'PT Serif',Georgia,serif;
    color:var(--cream);
    background:var(--dark);
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    overflow-x:hidden;
  }
  .stage{
    position:relative;min-height:100vh;min-height:100svh;
    display:flex;align-items:flex-end;justify-content:center;
    padding:0 24px 7vh;
    background:var(--dark) url("banner.jpg") center center / cover no-repeat;
  }
  /* On portrait / narrow screens show the whole banner (text intact), letterboxed on the dark bg */
  @media (max-aspect-ratio: 3/2){
    .stage{background-size:contain;align-items:center}
    .cta{position:absolute;bottom:7vh}
  }
  .cta{opacity:0;animation:fade 1.1s ease .5s forwards}
  .btn{
    display:inline-block;text-decoration:none;font-size:.78rem;letter-spacing:.16em;
    text-transform:uppercase;padding:16px 34px;transition:all .3s;
    background:var(--gold);color:var(--dark);font-weight:700;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.7);
  }
  .btn:hover{background:var(--gold-soft);transform:translateY(-2px)}
  .foot{
    position:absolute;bottom:20px;left:0;right:0;text-align:center;
    font-size:.72rem;letter-spacing:.14em;color:rgba(239,233,219,.45);
    opacity:0;animation:fade 1s ease 1s forwards;
  }
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
  <div class="stage">
    <div class="cta">
      <a href="https://www.instagram.com/cartelpoet88/" target="_blank" rel="noopener" class="btn">Follow on Instagram</a>
    </div>
    <div class="foot">© <span id="y"></span> · Yuriy Novodvorski · 18+</div>
  </div>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>

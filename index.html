<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuriy Novodvorski — Coming Soon · cartelpoet88</title>
<meta name="description" content="Yuriy Novodvorski (cartelpoet88) — the second part of Moleskin, coming soon. Only here.">
<meta property="og:title" content="Yuriy Novodvorski — Coming Soon">
<meta property="og:description" content="The second part of Moleskin — only here.">
<meta property="og:type" content="website">
<meta property="og:image" content="poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600&family=PT+Serif:ital,wght@0,400;1,400&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#efe9db;
    --dark:#0e1a15;
    --gold:#c3a35a;
    --gold-soft:#d8bd80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'PT Serif',Georgia,serif;
    color:var(--cream);
    background:var(--dark);
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    overflow-x:hidden;
  }
  .stage{
    position:relative;min-height:100vh;min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:56px 22px;
    background:var(--dark);
    isolation:isolate;overflow:hidden;
  }
  /* MOBILE / PORTRAIT: scene image + live text */
  .bgvid{display:none}
  .stage::before{
    content:"";position:absolute;inset:0;z-index:-2;
    background:url("banner.jpg") center center / cover no-repeat;
  }
  .stage::after{
    content:"";position:absolute;inset:0;z-index:-1;
    background:
      radial-gradient(72% 62% at 50% 46%, rgba(10,20,16,.72) 0%, rgba(10,20,16,.5) 68%, rgba(10,20,16,.74) 100%),
      linear-gradient(180deg, rgba(14,26,21,.5), rgba(14,26,21,.72));
  }
  .inner{max-width:720px;width:100%}
  .eyebrow{
    font-size:clamp(.66rem,2.6vw,.78rem);letter-spacing:.4em;text-transform:uppercase;
    color:var(--gold);font-weight:700;margin-bottom:clamp(16px,4vw,28px);padding-left:.4em;
    opacity:0;animation:fade .9s ease .15s forwards;
  }
  .name{
    font-family:'Caveat',cursive;
    font-size:clamp(3.2rem,16vw,6.6rem);
    line-height:.92;color:var(--cream);font-weight:600;
    text-shadow:0 2px 34px rgba(0,0,0,.65);
    opacity:0;animation:fade 1s ease .3s forwards;
  }
  .divider{
    width:62px;height:1px;background:var(--gold);margin:clamp(20px,5vw,30px) auto;opacity:0;
    animation:grow 1s ease .6s forwards;
  }
  .soon{
    font-family:'Playfair Display',serif;font-weight:500;
    font-size:clamp(1.5rem,6vw,2.3rem);letter-spacing:.02em;color:var(--gold-soft);
    text-shadow:0 2px 20px rgba(0,0,0,.55);
    opacity:0;animation:fade 1s ease .7s forwards;
  }
  .lede{
    margin:clamp(16px,4vw,22px) auto 0;max-width:430px;
    font-size:clamp(.98rem,3.6vw,1.1rem);line-height:1.6;
    color:rgba(239,233,219,.9);font-style:italic;
    text-shadow:0 1px 14px rgba(0,0,0,.6);
    opacity:0;animation:fade 1s ease .9s forwards;
  }
  .cta{margin-top:clamp(30px,7vw,42px);opacity:0;animation:fade 1s ease 1.1s forwards}
  .btn{
    display:inline-block;text-decoration:none;font-size:.78rem;letter-spacing:.16em;
    text-transform:uppercase;padding:16px 34px;transition:all .3s;
    background:var(--gold);color:var(--dark);font-weight:700;
    box-shadow:0 12px 30px -12px rgba(0,0,0,.75);
  }
  .btn:hover{background:var(--gold-soft);transform:translateY(-2px)}
  .foot{
    position:absolute;bottom:20px;left:0;right:0;text-align:center;
    font-size:.72rem;letter-spacing:.14em;color:rgba(239,233,219,.5);
    opacity:0;animation:fade 1s ease 1.4s forwards;
  }
  @keyframes fade{to{opacity:1;transform:none}}
  @keyframes grow{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:scaleX(1)}}

  /* DESKTOP / WIDE: animated smoke video (text is baked into it) */
  @media (min-aspect-ratio: 3/2){
    .bgvid{
      display:block;position:absolute;inset:0;z-index:-2;
      width:100%;height:100%;object-fit:cover;
    }
    .stage{align-items:flex-end;padding-bottom:9vh}
    .stage::before{display:none}
    .stage::after{
      background:linear-gradient(180deg, transparent 52%, rgba(10,20,16,.5) 100%);
    }
    .htmltext{display:none}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
</head>
<body>
  <div class="stage">
    <video class="bgvid" autoplay muted loop playsinline poster="poster.jpg">
      <source src="smoke.mp4" type="video/mp4">
    </video>
    <div class="inner">
      <div class="htmltext">
        <div class="eyebrow">cartelpoet88</div>
        <div class="name">Yuriy Novodvorski</div>
        <div class="divider"></div>
        <div class="soon">Coming Soon</div>
        <p class="lede">The second part of “Moleskin” — only here.</p>
      </div>
      <div class="cta">
        <a href="https://www.instagram.com/cartelpoet88/" target="_blank" rel="noopener" class="btn">Follow on Instagram</a>
      </div>
    </div>
    <div class="foot">© <span id="y"></span> · Yuriy Novodvorski · 18+</div>
  </div>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>

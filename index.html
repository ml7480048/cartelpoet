<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuriy Novodvorski — Coming Soon · cartelpoet88</title>
<meta name="description" content="Yuriy Novodvorski (cartelpoet88) — the second part of Moleskin, coming soon. Only here.">
<meta property="og:title" content="Yuriy Novodvorski — Coming Soon">
<meta property="og:description" content="The second part of Moleskin — only here.">
<meta property="og:type" content="website">
<meta property="og:image" content="poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#efe9db;--dark:#0e1a15;--gold:#c3a35a;--gold-soft:#d8bd80}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'PT Serif',Georgia,serif;color:var(--cream);background:var(--dark);
    -webkit-font-smoothing:antialiased;min-height:100%;overflow:hidden;
  }
  .stage{
    position:relative;min-height:100vh;min-height:100svh;
    display:flex;align-items:flex-end;justify-content:center;
    text-align:center;padding:0 22px 8vh;overflow:hidden;
    /* The banner itself as the background — mobile (vertical) by default. Always visible. */
    background:#0e1a15 url("poster-mobile.jpg") center center / cover no-repeat;
  }
  /* Video sits on top and plays the animated smoke; if it can't play, the banner background shows. */
  #bg{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;background:transparent}
  .overlay{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg, transparent 50%, rgba(10,20,16,.55) 100%)}
  .cta{position:relative;z-index:3;opacity:0;animation:fade 1.1s ease .5s forwards}
  .btn{
    display:inline-block;text-decoration:none;font-size:.78rem;letter-spacing:.16em;
    text-transform:uppercase;padding:16px 34px;transition:all .3s;
    background:var(--gold);color:var(--dark);font-weight:700;
    box-shadow:0 12px 30px -12px rgba(0,0,0,.8);
  }
  .btn:hover{background:var(--gold-soft);transform:translateY(-2px)}
  .foot{
    position:absolute;bottom:18px;left:0;right:0;z-index:3;text-align:center;
    font-size:.72rem;letter-spacing:.14em;color:rgba(239,233,219,.55);
    opacity:0;animation:fade 1s ease 1s forwards;
  }
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.cta,.foot{animation:none;opacity:1}}
  /* Desktop / wide: horizontal banner + horizontal video */
  @media (min-aspect-ratio: 3/2){
    .stage{background-image:url("poster.jpg")}
  }
</style>
</head>
<body>
  <div class="stage">
    <video id="bg" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="poster-mobile.jpg">
      <source src="smoke-mobile.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="cta">
      <a href="https://www.instagram.com/cartelpoet88/" target="_blank" rel="noopener" class="btn">Follow on Instagram</a>
    </div>
    <div class="foot">© <span id="y"></span> · Yuriy Novodvorski · 18+</div>
  </div>
<script>
  document.getElementById('y').textContent=new Date().getFullYear();
  (function(){
    var v=document.getElementById('bg');
    var mq=window.matchMedia('(min-aspect-ratio: 3/2)');
    function setSrc(mode){
      if(v.getAttribute('data-cur')===mode) return;
      v.setAttribute('data-cur',mode);
      v.setAttribute('poster', mode==='d' ? 'poster.jpg' : 'poster-mobile.jpg');
      v.innerHTML = '<source src="'+(mode==='d'?'smoke.mp4':'smoke-mobile.mp4')+'" type="video/mp4">';
      v.load();
      var p=v.play(); if(p&&p.catch){p.catch(function(){});}
    }
    if(mq.matches){ setSrc('d'); }
    else { v.setAttribute('data-cur','m'); var pp=v.play(); if(pp&&pp.catch){pp.catch(function(){});} }
    var onChange=function(){ setSrc(mq.matches?'d':'m'); };
    if(mq.addEventListener){mq.addEventListener('change',onChange);}else if(mq.addListener){mq.addListener(onChange);}
  })();
</script>
</body>
</html>
